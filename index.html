<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div id="rock" class="choice">  <img src="./imag/rock.png" alt="Rock"></div >
        <div id="paper" class="choice"> <img src="./imag/paper.png" alt="Paper"></div>
        <div id="scissors" class="choice">  <img src="./imag/scissors.jpg" alt="Scissors"></div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>Player</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Make your move!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
